<div class="bg-white dark:bg-slate-900 min-h-screen pb-20">
    <div class="h-[200px] w-full bg-slate-900 relative flex items-center justify-center">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxgY81BlkXLAsOYXbPn2tXlWVYq1pOCAkO2--B34J7z-gEv_vatuftlQ_YjNbOuDXJ-KXb45HSwB6pAr6H3GiypDBE6EScdeL58NrELC7ZmlNZa2CGNMMUnWcyPhFpqHqsxsfvkiSsxrybfuiMQ_g6kt9CXO84I8X1KSxpignIuoEtjZpji0QeNk2g_DfS60V2P742qXS8A8csiFhXvEPK8KiL_Vu2PKF77n99FkyLqC7Z1x4xOUrboUpTK2uBcQHxAh8Xb4YuFzU"
            class="absolute inset-0 w-full h-full object-cover opacity-50">
        <div class="relative z-10 text-center">
            <h1 class="text-white text-3xl font-bold mb-2">Danh sách sản phẩm</h1>
            <nav class="flex justify-center items-center text-sm text-slate-300">
                <a href="/" class="hover:text-white transition-colors">Trang chủ</a>
                <span class="mx-2">/</span>
                <span class="text-white">Danh sách sản phẩm</span>
            </nav>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col items-start lg:flex-row gap-10">
        <aside class="w-full lg:w-1/4 flex-shrink-0 space-y-10">

            <div>
                <div class="flex items-baseline justify-between mb-6 border-b pb-2">
                    <h3 class="text-lg font-bold m-0 uppercase tracking-wide text-slate-800 dark:text-white">
                        Danh mục</h3>
                    <button *ngIf="selectedCategory" (click)="clearCategory()"
                        class="text-sm text-blue-500 hover:text-blue-600 font-medium transition-colors">
                        Xóa
                    </button>
                </div>
                <div class="space-y-4">
                    <div *ngFor="let cat of categories" class="flex items-center group cursor-pointer">
                        <label [for]="'cat-' + cat.id" class="flex items-center cursor-pointer w-full">
                            <div class="relative flex items-center justify-center mr-3">
                                <input type="radio" [id]="'cat-' + cat.id" name="category_filter" [value]="cat.id"
                                    [(ngModel)]="selectedCategory" class="peer sr-only">
                                <div
                                    class="w-5 h-5 border border-slate-300 dark:border-slate-600 rounded-full peer-checked:border-primary peer-checked:bg-white dark:peer-checked:bg-slate-900 transition-all duration-200 flex items-center justify-center">
                                </div>
                                <i
                                    class="fa-solid fa-check absolute text-[10px] text-primary opacity-0 peer-checked:opacity-100 transition-all duration-200 transform scale-50 peer-checked:scale-100"></i>
                            </div>
                            <span
                                class="text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">{{
                                cat.name }}</span>
                            <span
                                class="ml-auto text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-500 py-0.5 px-2 rounded-full group-hover:bg-primary/10 group-hover:text-primary transition-colors">
                                {{ cat.count }}
                            </span>
                        </label>
                    </div>
                </div>
            </div>
            <div>
                <div class="flex items-baseline justify-between mb-6 border-b pb-2">
                    <h3 class="text-lg m-0 font-bold uppercase tracking-wide text-slate-800 dark:text-white">
                        Giá sản phẩm</h3>
                    <button *ngIf="selectedPriceRange" (click)="clearPrice()"
                        class="text-sm text-blue-500 hover:text-blue-600 font-medium transition-colors">
                        Xóa
                    </button>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center group cursor-pointer">
                        <label for="price-1" class="flex items-center cursor-pointer w-full">
                            <div class="relative flex items-center justify-center mr-3">
                                <input type="radio" id="price-1" name="price_filter" value="lt5"
                                    [(ngModel)]="selectedPriceRange" class="peer sr-only">
                                <div
                                    class="w-5 h-5 border border-slate-300 dark:border-slate-600 rounded-full peer-checked:border-primary peer-checked:bg-white dark:peer-checked:bg-slate-900 transition-all duration-200 flex items-center justify-center">
                                </div>
                                <i
                                    class="fa-solid fa-check absolute text-[10px] text-primary opacity-0 peer-checked:opacity-100 transition-all duration-200 transform scale-50 peer-checked:scale-100"></i>
                            </div>
                            <span
                                class="text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Dưới
                                5 triệu</span>
                        </label>
                    </div>
                    <div class="flex items-center group cursor-pointer">
                        <label for="price-2" class="flex items-center cursor-pointer w-full">
                            <div class="relative flex items-center justify-center mr-3">
                                <input type="radio" id="price-2" name="price_filter" value="5to10"
                                    [(ngModel)]="selectedPriceRange" class="peer sr-only">
                                <div
                                    class="w-5 h-5 border border-slate-300 dark:border-slate-600 rounded-full peer-checked:border-primary peer-checked:bg-white dark:peer-checked:bg-slate-900 transition-all duration-200 flex items-center justify-center">
                                </div>
                                <i
                                    class="fa-solid fa-check absolute text-[10px] text-primary opacity-0 peer-checked:opacity-100 transition-all duration-200 transform scale-50 peer-checked:scale-100"></i>
                            </div>
                            <span
                                class="text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Từ
                                5 triệu đến 10 triệu</span>
                        </label>
                    </div>
                    <div class="flex items-center group cursor-pointer">
                        <label for="price-3" class="flex items-center cursor-pointer w-full">
                            <div class="relative flex items-center justify-center mr-3">
                                <input type="radio" id="price-3" name="price_filter" value="gt10"
                                    [(ngModel)]="selectedPriceRange" class="peer sr-only">
                                <div
                                    class="w-5 h-5 border border-slate-300 dark:border-slate-600 rounded-full peer-checked:border-primary peer-checked:bg-white dark:peer-checked:bg-slate-900 transition-all duration-200 flex items-center justify-center">
                                </div>
                                <i
                                    class="fa-solid fa-check absolute text-[10px] text-primary opacity-0 peer-checked:opacity-100 transition-all duration-200 transform scale-50 peer-checked:scale-100"></i>
                            </div>
                            <span
                                class="text-slate-600 dark:text-slate-400 group-hover:text-primary transition-colors">Trên
                                10 triệu</span>
                        </label>
                    </div>
                </div>
            </div>
            <div>
                <div class="flex items-baseline justify-between mb-6 border-b pb-2">
                    <h3 class="text-lg m-0 font-bold uppercase tracking-wide text-slate-800 dark:text-white">
                        Trạng thái</h3>
                    <button *ngIf="statusFilters.isHot || statusFilters.isSale || statusFilters.inStock"
                        (click)="clearStatus()"
                        class="text-sm text-blue-500 hover:text-blue-600 font-medium transition-colors">
                        Xóa
                    </button>
                </div>
                <div class="flex flex-wrap gap-3">
                    <!-- Nổi bật -->
                    <button (click)="toggleStatusFilter('isHot')"
                        class="px-4 py-2 border rounded-md text-sm font-medium transition-all relative overflow-hidden group"
                        [ngClass]="{'border-primary text-primary bg-primary/5': statusFilters.isHot, 'border-slate-200 text-slate-600 hover:border-slate-300': !statusFilters.isHot}">
                        Nổi Bật
                        <div *ngIf="statusFilters.isHot"
                            class="absolute bottom-0 right-0 w-0 h-0 border-l-[16px] border-l-transparent border-b-[16px] border-b-primary">
                        </div>
                        <i *ngIf="statusFilters.isHot"
                            class="fa-solid fa-check absolute bottom-[1px] right-[1px] text-[8px] text-white"></i>
                    </button>

                    <!-- Giảm giá -->
                    <button (click)="toggleStatusFilter('isSale')"
                        class="px-4 py-2 border rounded-md text-sm font-medium transition-all relative overflow-hidden group"
                        [ngClass]="{'border-primary text-primary bg-primary/5': statusFilters.isSale, 'border-slate-200 text-slate-600 hover:border-slate-300': !statusFilters.isSale}">
                        Giảm giá
                        <div *ngIf="statusFilters.isSale"
                            class="absolute bottom-0 right-0 w-0 h-0 border-l-[16px] border-l-transparent border-b-[16px] border-b-primary">
                        </div>
                        <i *ngIf="statusFilters.isSale"
                            class="fa-solid fa-check absolute bottom-[1px] right-[1px] text-[8px] text-white"></i>
                    </button>

                    <!-- Còn hàng -->
                    <button (click)="toggleStatusFilter('inStock')"
                        class="px-4 py-2 border rounded-md text-sm font-medium transition-all relative overflow-hidden group"
                        [ngClass]="{'border-primary text-primary bg-primary/5': statusFilters.inStock, 'border-slate-200 text-slate-600 hover:border-slate-300': !statusFilters.inStock}">
                        Còn hàng
                        <div *ngIf="statusFilters.inStock"
                            class="absolute bottom-0 right-0 w-0 h-0 border-l-[16px] border-l-transparent border-b-[16px] border-b-primary">
                        </div>
                        <i *ngIf="statusFilters.inStock"
                            class="fa-solid fa-check absolute bottom-[1px] right-[1px] text-[8px] text-white"></i>
                    </button>
                </div>
            </div>

            <button
                class="w-full py-3 bg-primary text-white font-bold rounded-lg hover:bg-primary-dark transition-colors shadow-lg shadow-primary/30">
                Đặt lại
            </button>
        </aside>
        <main class="flex-1 w-full">
            <div
                class="flex flex-col sm:flex-row justify-between items-center bg-slate-50 dark:bg-slate-800/50 p-2 rounded-xl mb-8">
                <div class="text-sm text-slate-500 mb-4 sm:mb-0">
                    Hiển thị: <span class="font-bold text-slate-800 dark:text-white">12</span> / 24 / 36
                </div>
                <div class="flex items-center space-x-2 relative">
                    <div class="relative">
                        <button (click)="toggleSortDropdown($event)"
                            class="flex items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm rounded-lg px-4 py-2 outline-none focus:border-primary cursor-pointer hover:border-primary transition-colors w-[170px] justify-between">
                            <span class="font-medium text-slate-700 dark:text-slate-300">{{ currentSort }}</span>
                            <span class="material-symbols-outlined text-sm ml-2 transition-transform duration-200"
                                [class.rotate-180]="isSortDropdownOpen"><i class="fa-solid fa-chevron-down"></i></span>
                        </button>
                        <div *ngIf="isSortDropdownOpen"
                            class="absolute right-0 top-full mt-2 w-full min-w-[160px] bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-lg shadow-xl z-50 overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                            <ul class="py-1">
                                <li *ngFor="let option of sortOptions">
                                    <button (click)="selectSort(option)"
                                        class="w-full text-left px-4 py-2.5 text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary transition-colors flex items-center justify-between group">
                                        <span>{{ option }}</span>
                                        <span *ngIf="currentSort === option" class="text-primary text-xs"><i
                                                class="fa-solid fa-check"></i></span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <div *ngFor="let product of products"
                    class="group bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 overflow-hidden hover:shadow-xl hover:border-primary/20 transition-all duration-300 relative">
                    <div class="absolute top-3 left-3 z-10 flex flex-col gap-2">
                        <span *ngIf="product.discount"
                            class="bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">
                            -{{ product.discount }}%
                        </span>
                        <span *ngIf="product.isHot"
                            class="bg-orange-500 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">
                            HOT
                        </span>
                    </div>
                    <div class="relative w-full aspect-square overflow-hidden bg-slate-50 dark:bg-slate-800 cursor-pointer"
                        [routerLink]="['/products', product.id]">
                        <img [src]="product.image" [alt]="product.name"
                            class="w-full h-full object-contain p-4 group-hover:scale-110 transition-transform duration-500">
                        <div
                            class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-sm text-slate-800 dark:text-white mb-2 line-clamp-2 h-10 group-hover:text-primary transition-colors cursor-pointer"
                            [routerLink]="['/products', product.id]">
                            {{ product.name }}
                        </h3>
                        <div class="flex items-end justify-between">
                            <div class="flex flex-col">
                                <span *ngIf="product.price" class="text-primary font-bold text-sm">
                                    {{ formatPrice(product.price) }}
                                </span>
                                <span *ngIf="!product.price" class="text-primary font-bold text-sm">
                                    Liên hệ
                                </span>
                                <span *ngIf="product.originalPrice" class="text-xs text-slate-400 line-through">
                                    {{ formatPrice(product.originalPrice) }}
                                </span>
                            </div>
                            <button
                                class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-primary hover:text-white flex items-center justify-center transition-all shadow-sm">
                                <span class="material-symbols-outlined text-sm"><i
                                        class="fa-solid fa-cart-shopping"></i></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-12 flex justify-center space-x-2">
                <button
                    class="w-10 h-10 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined text-sm"><i class="fa-solid fa-chevron-left"></i></span>
                </button>
                <button
                    class="w-10 h-10 rounded-lg bg-primary text-white font-bold shadow-lg shadow-primary/30 flex items-center justify-center transition-all">1</button>
                <button
                    class="w-10 h-10 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium flex items-center justify-center transition-all">2</button>
                <button
                    class="w-10 h-10 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium flex items-center justify-center transition-all">3</button>
                <button
                    class="w-10 h-10 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined text-sm"><i class="fa-solid fa-chevron-right"></i></span>
                </button>
            </div>
        </main>
    </div>
</div>
