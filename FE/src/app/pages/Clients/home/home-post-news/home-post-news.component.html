<!-- Section: Tin tức mới -->
<div class="mb-12 flex items-center justify-center gap-4 mt-16">
    <h2 class="text-xl md:text-3xl font-bold tracking-tight text-gray-900 dark:text-white uppercase text-center">Tin
        tức mới</h2>
</div>

<div class="relative mb-24 px-6 mx-0 md:mx-12 lg:mx-20 lg:px-20">
    <!-- Navigation Arrows -->
    <button (click)="prevNews()"
        class="hidden md:flex w-[44px] h-[44px] rounded-full bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),0_2px_4px_-2px_rgba(0,0,0,0.1)] items-center justify-center text-[#475569] cursor-pointer transition-all duration-300 ease z-20 hover:bg-[#f8fafc] hover:scale-110 hover:shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] hover:text-[#0f172a] absolute -left-[22px] top-[35%] !z-30">
        <i class="fa-solid fa-angle-left"></i>
    </button>
    <button (click)="nextNews()"
        class="hidden md:flex w-[44px] h-[44px] rounded-full bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),0_2px_4px_-2px_rgba(0,0,0,0.1)] items-center justify-center text-[#475569] cursor-pointer transition-all duration-300 ease z-20 hover:bg-[#f8fafc] hover:scale-110 hover:shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] hover:text-[#0f172a] absolute -right-[22px] top-[35%] !z-30">
        <i class="fa-solid fa-angle-right"></i>
    </button>

    <!-- News Wrapper with overflow hidden -->
    <div class="overflow-hidden mx-[-1rem]">
        <!-- News Container (4 items filling 100% width) -->
        <div class="transition-transform duration-500 ease-out flex gap-6"
            [style.transform]="'translateX(calc(-' + (currentNewsIndex * 25) + '% - ' + (currentNewsIndex * 6) + 'px))'">
            <!-- News Cards (25% logic to match outer edges) -->
            <div *ngFor="let item of newsItems"
                class="flex flex-col gap-5 transition-all duration-300 ease cursor-pointer group flex-none w-full md:w-[calc(50%-12px)] lg:w-[calc(25%-18px)] px-4">
                <div class="relative aspect-[1.6/1] rounded-3xl overflow-hidden bg-[#f1f5f9]">
                    <img [alt]="item.title" [src]="item.image"
                        class="w-full h-full object-cover transition-transform duration-[600ms] ease-[cubic-bezier(0.4,0,0.2,1)] group-hover:scale-[1.08]" />
                </div>
                <div class="space-y-2">
                    <span class="text-[13px] font-medium text-[#94a3b8] block">{{item.date}}</span>
                    <h3
                        class="text-[1.05rem] font-bold text-[#0f172a] leading-relaxed m-0 line-clamp-2 transition-colors duration-300 ease group-hover:text-[#2563eb]">
                        {{item.title}}</h3>
                    <a class="text-[13px] font-extrabold text-[#2563eb] flex items-center gap-1 transition-all duration-300 ease hover:gap-2"
                        href="#">
                        Xem thêm
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
