<div class="text-center mb-12">
    <h2 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900 dark:text-white uppercase">Danh mục</h2>
</div>

<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-20">
    <div *ngFor="let category of array" class="category-card flex flex-col items-center group cursor-pointer">
        <div
            class="w-full aspect-[4/3] bg-[#e8eaed] dark:bg-slate-800 rounded-3xl flex items-center justify-center p-6 mb-4 transition-all duration-300 ease group-hover:bg-[#dadce0] border border-gray-100/50 dark:border-slate-700">
            <img [alt]="category.name"
                class="max-h-full object-contain mix-blend-multiply dark:mix-blend-normal transition-transform duration-[400ms] ease group-hover:scale-105"
                [src]="category.imageUrl" />
        </div>
        <span
            class="text-sm font-bold text-slate-700 dark:text-slate-300 group-hover:text-primary transition-colors text-center">{{
            category.name }}</span>
    </div>
</div>
