<div class="bg-slate-50 min-h-screen pb-20">
    <p-toast></p-toast>
    <div class="container mx-auto px-4 max-w-[1000px]">
        <app-client-breadcrumb [items]="breadcrumbItems"></app-client-breadcrumb>
        <div class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 p-8 md:p-12">
            <h1 class="text-3xl font-black text-center mb-12 uppercase tracking-wider text-slate-900">Đăng ký</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                <div class="space-y-1.5">
                    <label class="block text-[13px] text-slate-500 ml-1">Tài khoản *</label>
                    <input type="text" [(ngModel)]="registerData.username"
                        class="w-full px-6 py-3.5 rounded-full border border-slate-100 bg-slate-50/50 outline-none focus:border-primary focus:bg-white transition-all text-sm placeholder:text-slate-300">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-[13px] text-slate-500 ml-1">Mật khẩu *</label>
                    <input type="password" [(ngModel)]="registerData.password"
                        class="w-full px-6 py-3.5 rounded-full border border-slate-100 bg-slate-50/50 outline-none focus:border-primary focus:bg-white transition-all text-sm placeholder:text-slate-300">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-[13px] text-slate-500 ml-1">Email *</label>
                    <input type="email" [(ngModel)]="registerData.email"
                        class="w-full px-6 py-3.5 rounded-full border border-slate-100 bg-slate-50/50 outline-none focus:border-primary focus:bg-white transition-all text-sm placeholder:text-slate-300">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-[13px] text-slate-500 ml-1">Số điện thoại *</label>
                    <input type="tel" [(ngModel)]="registerData.phone"
                        class="w-full px-6 py-3.5 rounded-full border border-slate-100 bg-slate-50/50 outline-none focus:border-primary focus:bg-white transition-all text-sm placeholder:text-slate-300">
                </div>

                <div class="space-y-1.5">
                    <label class="block text-[13px] text-slate-500 ml-1">Thành phố *</label>
                    <input type="text" [(ngModel)]="registerData.city"
                        class="w-full px-6 py-3.5 rounded-full border border-slate-100 bg-slate-50/50 outline-none focus:border-primary focus:bg-white transition-all text-sm placeholder:text-slate-300">
                </div>

                <!-- Địa chỉ -->
                <div class="space-y-1.5">
                    <label class="block text-[13px] text-slate-500 ml-1">Địa chỉ *</label>
                    <input type="text" [(ngModel)]="registerData.address"
                        class="w-full px-6 py-3.5 rounded-full border border-slate-100 bg-slate-50/50 outline-none focus:border-primary focus:bg-white transition-all text-sm placeholder:text-slate-300">
                </div>
            </div>

            <div class="mt-12 max-w-[400px] mx-auto text-center space-y-6">
                <button (click)="onRegister()"
                    class="w-full py-4 bg-primary text-white font-bold rounded-full shadow-lg shadow-blue-400/30 hover:bg-primary-dark transition-all transform active:scale-[0.98] uppercase tracking-widest text-sm">
                    Đăng ký
                </button>

                <p class="text-sm text-slate-500">
                    Bạn đã có tài khoản?
                    <a href="#" class="text-primary font-bold hover:underline">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</div>
