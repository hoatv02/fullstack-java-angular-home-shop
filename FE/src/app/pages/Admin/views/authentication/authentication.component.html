<p-tabs [(value)]="selectTabs">
  <p-tablist>
    <p-tab *ngFor="let tab of tabs" [value]="tab.value">
      {{ tab.title |translate}}
    </p-tab>
  </p-tablist>

  <p-tabpanels>
    <p-tabpanel *ngFor="let tab of tabs" [value]="tab.value">
      <ng-container *ngIf="selectTabs === tab.value">
        <!-- Nếu là component -->
        <ng-container *ngIf="tab.component; else stringContent">
          <ng-container *ngComponentOutlet="tab.component"></ng-container>
        </ng-container>

        <!-- Nếu là chuỗi content -->
        <ng-template #stringContent>
          <p class="m-0">{{ tab.content }}</p>
        </ng-template>
      </ng-container>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
