<ng-container *ngIf="permissions['VIEW']&&!router.url.includes('/customer-detail')">
    <div class="card">
        <p-tabs [value]="selectTabs" (valueChange)="tabIndexChange($event)">
            <p-tablist>
                <p-tab value="0">{{ 'CustomerManagement.List.Individual' | translate }}</p-tab>
                <p-tab value="1">{{ 'CustomerManagement.List.Enterprise' | translate }}</p-tab>
            </p-tablist>

            <p-tabpanels>
                <p-tabpanel value="0">
                    <ng-container *ngIf="selectTabs === '0'">
                        <app-table [title_list]="'CustomerManagement.List.IndividualList' | translate" [data]="dataList"
                            [columns]="columns" [selection]="[]" [config]="{
                toolbar: { new: false, delete: false, export: true, sync: false },
                actions: { view: permissions['DETAIL'], edit: false, delete: false ,lock:permissions['UPDATED'],
                    isShowAction:permissions['DETAIL']||permissions['UPDATED']||false
                }
              }" [selectFilter]="false" [selectFilter1]="true"
                            [placeholderSelectFilter]="'CustomerManagement.Filter.Type' | translate"
                            [placeholderSelectFilter1]="'CustomerManagement.Filter.Status' | translate"
                            [selectFilter1Data]="statusList" (selectFilter1Change)="statusCNChange($event)"
                            [placeholderTextSearch]="'CustomerManagement.Placeholder.Search' | translate"
                            [paginationConfig]="{
                enabled: true,
                rows: 10,
                rowsPerPageOptions: [5, 10, 25, 50]
              }" [first]="first" [exportdata]="true" [showSelectionColumn]="false" [tagConfig]="tagConfig"
                            (onExportCSV)="exportExcel()" (onLazyLoad)="handleLazyLoad($event)"
                            (onSearch)="handleSearchKeyword($event)" (onView)="onView($event)"
                            [totalRecords]="totalRecords" (onSwitchChange)="handleSwitchChange($event)"
                            (onLock)="onLockCustomer($event,1)" />
                    </ng-container>
                </p-tabpanel>

                <p-tabpanel value="1">
                    <ng-container *ngIf="selectTabs === '1'">
                        <app-table [title_list]="'CustomerManagement.List.EnterpriseList' | translate" [data]="dataList"
                            [columns]="columns" [selection]="[]" [config]="{
                toolbar: { new: false, delete: false, export: true, sync: false },
                actions: { view: permissions['DETAIL'], edit: false, delete: false ,lock:permissions['UPDATED'],
                    isShowAction:permissions['DETAIL']||permissions['UPDATED']||false
                }
              }" [selectFilter]="false" [selectFilter1]="true"
                            [placeholderSelectFilter]="'CustomerManagement.Filter.Type' | translate"
                            [placeholderSelectFilter1]="'CustomerManagement.Filter.Status' | translate"
                            [selectFilter1Data]="statusList" (selectFilter1Change)="statusDNChange($event)"
                            [placeholderTextSearch]="'CustomerManagement.Placeholder.Search' | translate"
                            [paginationConfig]="{
                enabled: true,
                rows: 10,
                rowsPerPageOptions: [5, 10, 25, 50]
              }" [first]="first" [exportdata]="true" [showSelectionColumn]="false" [tagConfig]="tagConfig"
                            (onExportCSV)="exportExcel()" (onLazyLoad)="handleLazyLoadTC($event)"
                            (onSearch)="handleSearchKeyword($event)" (onView)="onView($event)"
                            [totalRecords]="totalRecords" (onSwitchChange)="handleSwitchChange($event)"
                            (onLock)="onLockCustomer($event,2)" />
                    </ng-container>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </div>
</ng-container>
<!-- Dialog xác nhận -->
<app-confirm-dialog [visible]="displayConfirmation"
    [message]="'CustomerManagement.Dialog.ConfirmDeleteMessage' | translate"
    [header]="'CustomerManagement.Dialog.ConfirmDeleteHeader' | translate"
    [confirmLabel]="'CustomerManagement.Dialog.Confirm' | translate"
    [cancelLabel]="'CustomerManagement.Dialog.Cancel' | translate" (confirm)="onConfirmSwitchChange()"
    (cancel)="displayConfirmation = false" />

<app-confirm-dialog [visible]="confirmationLock" [message]="'Common.ConfirmChangeStatusMessage'|translate"
    [formTemplate]="formReason" [header]="'Common.ChangeStatusCustomerTitle'|translate"
    [confirmLabel]="'Common.ConfirmDeleteYes' | translate" [cancelLabel]="'Common.ConfirmDeleteNo' | translate"
    (confirm)="stepBySendOtp()" [confirmVisiable]="!reasonValue" (cancel)="confirmationLock=false" width="500px">
    <ng-template #formReason>
        <div>
            <label for="description"
                class="block text-sm font-semibold text-gray-700 mb-1">{{'Common.Reason'|translate}}</label>
            <textarea pInputText id="description" [(ngModel)]="reasonValue"
                class="w-full h-full rounded-md border border-gray-300 px-3 py-2 resize-none"></textarea>
        </div>
    </ng-template>
</app-confirm-dialog>


<app-confirm-dialog [visible]="otpConfirmVisiable" [message]="'Common.ConfirmChangeStatusMessage' | translate"
    [header]="'Common.OTPVerification' | translate" [confirmLabel]="'Common.ConfirmSave' | translate"
    [formTemplate]="formTpl" [cancelLabel]="'Common.ConfirmDeleteNo' | translate" [showButtonCancel]="false"
    [showButtonSubmit]="false" (cancel)="otpConfirmVisiable=false" width="500px">
    <ng-template #formTpl>
        <div class="">
            <div class="flex text-center items-center justify-center">
                <label for="password1" class="block text-surface-900 dark:text-surface-0 font-medium  mb-2"
                    [innerHTML]="'Common.ConfirmOtpSendMail' | translate">
                </label>
            </div>
            <div class="flex justify-center">
                <p-inputOtp [length]="6" [(ngModel)]="otpValue"
                    inputClass="w-10 h-12 sm:w-14 sm:h-14 lg:w-20 lg:h-20 text-lg text-center rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition" />
            </div>
            <p-button [disabled]="!otpValue" [label]="'Common.ConfirmChangeStatus' | translate" styleClass="w-full mt-4"
                (onClick)="submitLockCustomer()" type="submit"></p-button>
        </div>
    </ng-template>
</app-confirm-dialog>
