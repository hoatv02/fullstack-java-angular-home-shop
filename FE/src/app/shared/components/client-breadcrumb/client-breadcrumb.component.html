<div class="container mx-auto px-4 py-8">
    <nav class="flex items-center gap-3 text-[11px] font-black uppercase tracking-[0.1em]">
        <a routerLink="/" class="text-slate-400 hover:text-primary transition-all flex items-center gap-2 group">
            <i class="fa-solid fa-house text-[13px]"></i>
            Trang chủ
        </a>

        <ng-container *ngFor="let item of items; let last = last">
            <span class="text-slate-300">
                <i class="fa-solid fa-chevron-right text-[9px]"></i>
            </span>

            <a *ngIf="!last && item.routerLink" [routerLink]="item.routerLink"
                class="text-slate-400 hover:text-primary transition-all">
                {{ item.label }}
            </a>

            <span *ngIf="!last && !item.routerLink" class="text-slate-400">
                {{ item.label }}
            </span>

            <span *ngIf="last" class="text-primary border-b-2 border-primary/20 pb-0.5">
                {{ item.label }}
            </span>
        </ng-container>
    </nav>
</div>
